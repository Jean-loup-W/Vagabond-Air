<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png"
          href="https://www.de-plume-en-plume.fr/uploads/images/sources/7a984c5cffbbe783131e83e7af8cf327b9b3dbdf.png">
    <title>Vagabond'air - Bêta</title>
    <link rel="stylesheet" href="/assets/css/style.css">
    <script type="module" src="/assets/js/core.js"></script>
    <meta name="robots" content="noindex, nofollow">
    
    <style>
        /* Style du bouton Paramètres en haut à droite (admin) */
        #btn-parametres {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 10000;
            background: #ffffff;
            color: #333333;
            border: 2px solid #e0e0e0;
            padding: 10px 16px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: all 0.2s ease;
        }
        #btn-parametres:hover {
            background: #f7f9fa;
            border-color: #cbd5e1;
            transform: translateY(-1px);
        }

        /* Bouton "Supprimer mon accès" seul, en haut à droite (VIP) */
        #btn-supprimer-acces {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 10000;
            background: #fb923c;
            color: #ffffff;
            border: none;
            padding: 10px 16px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: all 0.2s ease;
        }
        #btn-supprimer-acces:hover {
            background: #f97316;
            transform: translateY(-1px);
        }

        /* Fenêtre modale des paramètres */
        #modal-parametres {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            z-index: 10001;
            justify-content: center;
            align-items: center;
        }

        .modal-conteneur {
            background: rgb(243, 236, 203);
            padding: 35px 30px;
            border-radius: 20px;
            width: 90%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            animation: modalFadeIn 0.25s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        @keyframes modalFadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .modal-conteneur h3 {
            margin-bottom: 25px;
            font-size: 1.4rem;
            color: #1e293b;
            font-weight: 700;
        }

        .btn-modal-action {
            width: 100%;
            max-width: 360px;
            padding: 14px 20px;
            margin-bottom: 14px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            transition: opacity 0.2s ease, transform 0.1s ease, background-color 0.2s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        
        .btn-modal-action:active {
            transform: scale(0.98);
        }

        #btn-modal-clear {
            background-color: #f87171;
            color: #ffffff;
        }
        #btn-modal-clear:hover { background-color: #ef4444; }

        #btn-modal-revoke {
            background-color: #fb923c;
            color: #ffffff;
        }
        #btn-modal-revoke:hover { background-color: #f97316; }

        #btn-modal-fermer {
            background-color: #bb80ff;
            color: #000000;
            margin-bottom: 0;
            margin-top: 5px;
        }
        #btn-modal-fermer:hover { background-color: #cbd5e1; }
    </style>
    <script type="module" src="/assets/js/beta-tools.js"></script>
</head>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const boutonsTest = document.querySelectorAll('.btn-test-verifier');

        boutonsTest.forEach(btn => {
            const fileUrl = btn.getAttribute('href');
            if (!fileUrl) return;
            fetch(fileUrl, { method: 'HEAD' })
                .then(response => {
                    if (response.ok) {
                        btn.classList.remove('disabled');
                        btn.removeAttribute('title');
                        btn.style.pointerEvents = 'auto';
                        btn.style.opacity = '1';
                    } else {
                        desactiverBouton(btn);
                    }
                })
                .catch(() => {
                    desactiverBouton(btn);
                });
        });

        function desactiverBouton(bouton) {
            bouton.classList.add('disabled');
            bouton.setAttribute('title', 'Ce fichier n\'est pas disponible. Insérez-le dans le dossier pour y accéder.');
            bouton.style.opacity = '0.5';
            bouton.style.cursor = 'not-allowed';
            bouton.addEventListener('click', (e) => {
                e.preventDefault();
            });
        }
    });
</script>

<body class="bg-1">

<!-- ADMIN : bouton Paramètres (le JS le supprime pour le VIP) -->
<button id="btn-parametres">⚙️ Paramètres</button>

<!-- VIP : bouton "Supprimer mon accès" seul (le JS le supprime pour l'admin) -->
<button id="btn-supprimer-acces">🔒 Supprimer mon accès</button>

<!-- Fenêtre modale des Paramètres (admin) -->
<div id="modal-parametres">
    <div class="modal-conteneur">
        <h3>Paramètres Bêta</h3>
        <button id="btn-modal-clear" class="btn-modal-action">🗑️ Supprimer les sauvegardes</button>
        <button id="btn-modal-simuler-vip" class="btn-modal-action" style="background-color: #38bdf8; color: #ffffff;">👁️ Tester la vue VIP</button>
        <button id="btn-modal-simuler-joueur" class="btn-modal-action" style="background-color: #10b981; color: #ffffff;">👤 Tester la vue Joueur</button>
        <button id="btn-modal-revoke" class="btn-modal-action">🔒 Supprimer l'accès admin</button>
        <button id="btn-modal-fermer" class="btn-modal-action">Fermer</button>
    </div>
</div>

<img class="logo-accueil"
     src="https://www.de-plume-en-plume.fr/uploads/images/sources/7a984c5cffbbe783131e83e7af8cf327b9b3dbdf.png"
     alt="Logo Vagabond-Air">

<!-- Contenu protégé de la Bêta avec tous les boutons -->
<div id="contenu-beta">
    <div style="margin-top: 30px;">
        <a href="/saveur-festivite/" class="btn-link btn-retour btn-test-verifier">Découvrez Saveur & Festivité</a><br>
        <a href="/Promenade/Index.html" class="btn-link btn-test-verifier">Promenade champêtre</a><br>
        <a href="/test/R_Augmentée.html" class="btn-link btn-test-verifier">Réalité Augmentée</a><br>

        
        <br><br>
        <a href="/" class="btn-link btn-accueil">Accueil</a><br>
    </div>
</div>

</body>
</html>
